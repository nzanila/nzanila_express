<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Seller Central - Nzanila Express</title>
    <meta name="description" content="Run your Nzanila storefront: products, orders, inventory, pricing and buyer messages." />

    <!-- Installable app. The icon is navy where the marketplace's is white, so a seller
         with both installed can tell them apart on the home screen. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#233548" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seller Central" />
    <!-- iOS ignores the manifest entirely and reads this. -->
    <link rel="apple-touch-icon" href="/app-icon-192.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
